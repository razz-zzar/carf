<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f0d">
<meta name="application-name" content="OPS SJT">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chegadas e Saídas</title>

<link rel="icon" href="carf-icon-192.png">
<link rel="apple-touch-icon" href="carf-icon-192.png">
<style>
/* Layout: ecrã único — resumo do dia em cima, lista das voltas com um botão grande "Chegou" por volta */
:root{
  --bg:#0c0f0d; --panel:#151a17; --line:#26302a; --fg:#eef3ef; --muted:#93a39a;
  --green:#B9D406; --green-dk:#94aa05; --green-ink:#0a0a0a; --danger:#e0574f;
  --display:"Roboto Condensed","sans-serif-condensed","Arial Narrow",Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
button{-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{padding-block:calc(14px + env(safe-area-inset-top,0px)) 12px;border-bottom:2px solid var(--green);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:40px;width:auto;max-width:42%;background:#fff;border-radius:8px;padding:5px 8px;flex:none}
h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.voltar{display:inline-flex;align-items:center;min-height:36px;color:var(--green);font:600 15px var(--body);text-decoration:none;letter-spacing:.02em}
.datebox input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:500 14px var(--mono)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0;color:var(--green)}
.summary{display:flex;gap:12px}
.stat{flex:1;border-left:3px solid var(--green);padding-left:10px}
.stat.falta{border-left-color:var(--line)}
.stat b{display:block;font:600 28px var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.barra{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
@media (prefers-reduced-motion:reduce){.barra i{transition:none}}
.aviso{font-size:14px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px}
#lista{display:flex;flex-direction:column;gap:8px}
.v{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"num btn" "est btn";column-gap:12px;row-gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 14px;min-height:68px}
.v.ok{border-color:#3a4a12}
.num{font:700 26px/1 var(--display);letter-spacing:.03em;font-variant-numeric:tabular-nums;min-width:0}
.num.txt{font-size:22px;line-height:1.1;overflow-wrap:break-word}
.num small{display:block;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.est{min-width:0;font-size:14px;color:var(--muted)}
.chegou{border:0;border-radius:10px;padding:14px 14px;min-width:100px;font:700 19px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;background:var(--green);color:var(--green-ink)}
.chegou:active{background:var(--green-dk)}
.chegou:disabled{background:var(--line);color:var(--muted);cursor:default}
.anular{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:10px 12px;font:600 13px var(--body);cursor:pointer}
.anular.confirm{border-color:var(--danger);color:var(--danger)}
.hora{display:inline-flex;align-items:baseline;gap:8px;background:none;border:0;padding:2px 0;margin:0;font:600 22px var(--mono);color:var(--green);font-variant-numeric:tabular-nums;cursor:pointer}
.hora:disabled{cursor:default}
.lapis{font:600 12px var(--body);color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.est{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:12px;row-gap:2px}
.indicar{background:none;border:0;padding:4px 0;margin-top:2px;color:var(--green);font:600 13px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.v.ed{grid-template-areas:"num num" "ed ed"}
.v>.num{grid-area:num}.v>.est{grid-area:est}.v>button{grid-area:btn}.v>.editor{grid-area:ed}
.editor{display:flex;flex-direction:column;gap:8px;min-width:0}
.editor label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.editor input{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--green);border-radius:8px;padding:10px;font:600 24px var(--mono)}
.ed-btns{display:flex;gap:8px;justify-content:flex-end}
.guardar{border:0;border-radius:8px;padding:10px 18px;font:700 17px var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--green);color:var(--green-ink);cursor:pointer}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
.abas button{border:0;border-radius:8px;padding:14px 8px;background:transparent;color:var(--muted);font:700 19px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.abas button[aria-selected=true]{background:var(--green);color:var(--green-ink)}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:6px;cursor:pointer;min-width:100px}
.sw:disabled{cursor:default;opacity:.5}
.trilho{position:relative;display:block;width:68px;height:38px;border-radius:19px;background:var(--line);border:2px solid var(--muted);transition:background .2s,border-color .2s}
.bola{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:var(--fg);transition:transform .2s}
.sw[aria-checked=true] .trilho{background:var(--green);border-color:var(--green)}
.sw[aria-checked=true] .bola{transform:translateX(30px);background:var(--green-ink)}
.sw.confirm .trilho{border-color:var(--danger)}
.sw small{font:600 11px var(--body);color:var(--danger)}
@media (prefers-reduced-motion:reduce){.trilho,.bola{transition:none}}
.v.extra{border-style:dashed}
.btn{border-radius:10px;padding:16px;font:700 20px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--green);border:2px solid var(--green)}
.msg{font-size:14px;min-height:20px}
.msg.ok{color:var(--green)} .msg.err{color:var(--danger)}
.hint{font-size:13px;color:var(--muted)}
</style>
</head>

      <div style="min-width:0"><h1>Chegadas e Saídas</h1><a class="voltar" href="./">‹ Início</a></div>
    </div>
    <div class="datebox"><input type="date" id="dia" aria-label="Dia"></div>
  </header>

  <div class="abas" role="tablist" aria-label="Registo">
    <button type="button" role="tab" id="abaC" aria-selected="true">Chegadas</button>
    <button type="button" role="tab" id="abaS" aria-selected="false">Saídas</button>
  </div>

  <section class="card" aria-labelledby="t-res">
    <h2 id="t-res">Resumo do dia</h2>
    <div class="summary">
      <div class="stat"><b id="sOk">0</b><span id="lOk">Chegaram</span></div>
      <div class="stat falta"><b id="sFalta">0</b><span id="lFalta">Por chegar</span></div>
    </div>
    <div class="barra" aria-hidden="true"><i id="barra"></i></div>
  </section>

    <h2 id="t-voltas">Voltas — chegadas</h2>
    <div class="aviso" id="aviso" hidden>Está a ver outro dia. Só é possível fazer registos no dia de hoje.</div>
    <div class="msg" id="msg" role="status"></div>
    <div id="lista"></div>
    <div class="hint" id="dica"></div>
  </section>

  <section class="card" id="exportar" hidden>
    <button class="btn" id="excel" type="button">Exportar Excel do dia</button>

<script>
/* Listas das voltas, pela ordem indicada */
const VOLTAS_C=["1123","1633","1636","1419","1420","1639","1627","1638","1205","1235","1603","1201","1602","1204","1113","1112","1311","1330","1337","1340","1445","1315","1318","1624","1316","1334","1314","1317","1641","Arrasto Norte","Carro Leiria","Recolha Santogal","AS Parts Seixal","Carro extra Leiria"];
/* Entradas com interruptor em vez de botão: ao ligar regista a hora como as outras voltas */
const INTERRUPTOR=new Set(["Carro extra Leiria"]);
const VOLTAS_S=["1123","1633","1636","1419","1420","1639","1627","1638","1205","1235","1603","1201","1602","1204","1113","1112","1311","1330","1337","1340","1445","1315","1318","1624","1316","1334","1314","1317","1641","PSAR"];
/* Para o Excel: todas as voltas, chegadas primeiro e depois as que só têm saída */
const VOLTAS_TODAS=[...VOLTAS_C,...VOLTAS_S.filter(v=>!VOLTAS_C.includes(v))];

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const diaDe=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoje=()=>diaDe(new Date());
const hora=iso=>{const d=new Date(iso);return pad(d.getHours())+":"+pad(d.getMinutes());};
const horaSeg=iso=>{const d=new Date(iso);return hora(iso)+":"+pad(d.getSeconds());};

/* Dois registos separados, com a mesma lista de voltas: c = chegadas, s = saídas */
const MODOS={
  c:{chave:"chegadas",btn:"Chegou",feito:"Chegou",falta:"Por chegar",ok:"Chegaram",lfalta:"Por chegar",campo:"Hora de chegada",tit:"Voltas — chegadas",
     dica:"Carregue em “Chegou” quando a volta chegar: fica registada a hora desse momento. Se não viu a chegada, use “Indicar hora”, ou toque na hora já registada para a corrigir. Os registos ficam guardados neste telemóvel, mesmo sem internet.",
     fez:(v,h)=>(INTERRUPTOR.has(v)?v:"Volta "+v)+" chegou às "+h+".",nome:"chegada"},
  s:{chave:"saidas",btn:"Saiu",feito:"Saiu",falta:"Por sair",ok:"Saíram",lfalta:"Por sair",campo:"Hora de saída",tit:"Voltas — saídas",
     dica:"Carregue em “Saiu” quando a volta sair: fica registada a hora desse momento. Se não viu a saída, use “Indicar hora”, ou toque na hora já registada para a corrigir. Os registos ficam guardados neste telemóvel, mesmo sem internet.",
     fez:(v,h)=>"Volta "+v+" saiu às "+h+".",nome:"saída"}
};
let modo="c",BD={c:{},s:{}},aConfirmar=null,diaAberto=hoje();
for(const k of ["c","s"]){try{BD[k]=JSON.parse(localStorage.getItem(MODOS[k].chave)||"{}")||{};}catch(e){BD[k]={};}}
try{const m=localStorage.getItem("chegadas_aba");if(m==="s")modo="s";}catch(e){}
const D=()=>BD[modo],T=()=>MODOS[modo],V=()=>modo==="c"?VOLTAS_C:VOLTAS_S;
function gravar(){try{localStorage.setItem(T().chave,JSON.stringify(D()));return true}catch(e){return false}}
function mudarAba(m){modo=m;aConfirmar=null;aEditar=null;msg("msg","");msg("msgX","");try{localStorage.setItem("chegadas_aba",m);}catch(e){}render();}
function msg(id,t,ok){const m=$(id);m.textContent=t||"";m.className="msg "+(ok?"ok":"err");}

$("dia").value=diaAberto;
$("abaC").onclick=()=>mudarAba("c");$("abaS").onclick=()=>mudarAba("s");
$("dia").addEventListener("change",()=>{aConfirmar=null;msg("msg","");msg("msgX","");render();});

/* Cada chegada: {t: hora ISO}. Registos antigos podem ser só a hora ISO. */
const reg=x=>!x?null:typeof x==="string"?{t:x}:x;
let aEditar=null;
function render(){
  const dia=$("dia").value||hoje(),doDia=D()[dia]||{},eHoje=dia===hoje(),t=T();
  $("abaC").setAttribute("aria-selected",modo==="c");$("abaS").setAttribute("aria-selected",modo==="s");
  $("lOk").textContent=t.ok;$("lFalta").textContent=t.lfalta;$("t-voltas").textContent=t.tit;$("dica").textContent=t.dica;
  $("exportar").hidden=modo!=="s";
  /* O carro extra é opcional: não conta para o resumo */
  const fixas=V().filter(v=>!INTERRUPTOR.has(v)),ok=fixas.filter(v=>doDia[v]).length;
  $("sOk").textContent=ok;$("sFalta").textContent=fixas.length-ok;
  $("barra").style.width=(fixas.length?ok/fixas.length*100:0)+"%";
  $("aviso").hidden=eHoje;
  if(!eHoje)aEditar=null;
  const l=$("lista");l.textContent="";
  V().forEach(v=>{
    const r=reg(doDia[v]),row=document.createElement("div");row.className="v"+(r?" ok":"");
    const n=document.createElement("div");n.className="num"+(/^\d+$/.test(v)?"":" txt");n.innerHTML=INTERRUPTOR.has(v)?"<small>Extra</small>":"<small>Volta</small>";n.append(v);
    if(aEditar===v){row.classList.add("ed");row.append(n,editor(v,r));l.appendChild(row);return;}
    const e=document.createElement("div");e.className="est";
    if(r){
      const b=document.createElement("button");b.type="button";b.className="hora";b.disabled=!eHoje;
      b.setAttribute("aria-label","Corrigir hora da volta "+v);b.textContent=hora(r.t);
      if(eHoje){const p=document.createElement("span");p.className="lapis";p.textContent="Editar";b.appendChild(p);}
      b.onclick=()=>abrirEditor(v);
      e.append(b,t.feito);
    }else{
      e.append(t.falta);
      if(eHoje){const i=document.createElement("button");i.type="button";i.className="indicar";i.textContent="Indicar hora";i.onclick=()=>abrirEditor(v);e.appendChild(i);}
    }
    let btn;
    if(INTERRUPTOR.has(v)){
      btn=document.createElement("button");btn.type="button";btn.className="sw"+(aConfirmar===v?" confirm":"");
      btn.setAttribute("role","switch");btn.setAttribute("aria-checked",r?"true":"false");btn.setAttribute("aria-label",v);btn.disabled=!eHoje;
      btn.innerHTML='<span class="trilho"><span class="bola"></span></span>';
      if(aConfirmar===v){const c=document.createElement("small");c.textContent="Toque para desligar";btn.appendChild(c);}
      btn.onclick=()=>r?anular(v):chegou(v);
      row.classList.add("extra");
    }else if(r){btn=document.createElement("button");btn.type="button";btn.className="anular"+(aConfirmar===v?" confirm":"");
      btn.textContent=aConfirmar===v?"Confirmar":"Anular";btn.onclick=()=>anular(v);btn.hidden=!eHoje;}
    else{btn=document.createElement("button");btn.type="button";btn.className="chegou";btn.textContent=t.btn;
      btn.disabled=!eHoje;btn.onclick=()=>chegou(v);btn.setAttribute("aria-label","Volta "+v+" "+t.btn.toLowerCase());}
    row.append(n,e,btn);l.appendChild(row);
  });
  if(aEditar){const i=$("hEd");if(i)i.focus();}
}
function abrirEditor(v){aEditar=v;aConfirmar=null;msg("msg","");render();}
function editor(v,r){
  const w=document.createElement("div");w.className="editor";
  const lb=document.createElement("label");lb.htmlFor="hEd";lb.textContent=T().campo;
  const i=document.createElement("input");i.type="time";i.id="hEd";
  const base=r?new Date(r.t):new Date();i.value=pad(base.getHours())+":"+pad(base.getMinutes());
  const g=document.createElement("button");g.type="button";g.className="guardar";g.textContent="Guardar";
  const c=document.createElement("button");c.type="button";c.className="anular";c.textContent="Cancelar";
  g.onclick=()=>guardarHora(v,i.value);c.onclick=()=>{aEditar=null;render();};
  i.addEventListener("keydown",e=>{if(e.key==="Enter")guardarHora(v,i.value);if(e.key==="Escape"){aEditar=null;render();}});
  const bs=document.createElement("div");bs.className="ed-btns";bs.append(c,g);
  w.append(lb,i,bs);return w;
}
function guardarHora(v,val){
  const m=/^(\d{1,2}):(\d{2})/.exec(val||"");
  if(!m){msg("msg","Escreva a hora (horas e minutos).",false);return;}
  const dia=$("dia").value,[y,mo,d]=dia.split("-").map(Number);
  const dt=new Date(y,mo-1,d,+m[1],+m[2],0);
  if(dt.getTime()>Date.now()+60000){msg("msg","A hora "+val+" ainda não chegou. Indique uma hora até agora.",false);return;}
  const dados=D(),antes=(dados[dia]||{})[v];
  (dados[dia]=dados[dia]||{})[v]={t:dt.toISOString()};
  if(!gravar()){if(antes)dados[dia][v]=antes;else delete dados[dia][v];msg("msg","O telemóvel não deixou guardar (sem espaço ou armazenamento bloqueado).",false);return;}
  aEditar=null;msg("msg","Volta "+v+": "+T().nome+" registada às "+hora(dt.toISOString())+".",true);render();
}
function chegou(v){
  const agora=new Date(),dia=diaDe(agora),dados=D();
  if($("dia").value!==dia){$("dia").value=dia;}
  (dados[dia]=dados[dia]||{});
  if(dados[dia][v]){render();return;}
  dados[dia][v]={t:agora.toISOString()};
  if(!gravar()){delete dados[dia][v];msg("msg","O telemóvel não deixou guardar (sem espaço ou armazenamento bloqueado).",false);render();return;}
  aConfirmar=null;aEditar=null;msg("msg",T().fez(v,hora(agora.toISOString())),true);render();
}
function anular(v){
  if(aConfirmar!==v){aConfirmar=v;render();setTimeout(()=>{if(aConfirmar===v){aConfirmar=null;render();}},4000);return;}
  aConfirmar=null;const dia=$("dia").value,dados=D();
  if(dados[dia]){delete dados[dia][v];if(!Object.keys(dados[dia]).length)delete dados[dia];}
  gravar();msg("msg",(modo==="c"?"Chegada":"Saída")+" da volta "+v+" anulada.",true);render();
}

document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&$("dia").value===diaAberto&&hoje()!==diaAberto){diaAberto=hoje();$("dia").value=diaAberto;render();}});
setInterval(()=>{if($("dia").value===diaAberto&&hoje()!==diaAberto){diaAberto=hoje();$("dia").value=diaAberto;render();}},60000);

/* Gerador mínimo de .xlsx (sem bibliotecas, funciona offline) */
const MIME_XLSX="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const [name,data] of files){
    const nb=enc.encode(name),crc=crc32(data);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,data);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+data.length;
  }
  const cdSize=central.reduce((a,p)=>a+p.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  const all=[...parts,...central,end],out=new Uint8Array(all.reduce((a,p)=>a+p.length,0));let o=0;
  for(const p of all){out.set(p,o);o+=p.length;}return out;
}
function criarXlsx({titulo,folha,cab,linhas,larguras}){
  const X=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const L="ABCDEFGH",nc=cab.length,ult=3+linhas.length;
  const cel=(r,c,v,s)=>v===""||v==null?`<c r="${L[c]}${r}" s="${s}"/>`:typeof v==="number"?`<c r="${L[c]}${r}" s="${s}"><v>${v}</v></c>`:`<c r="${L[c]}${r}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`;
  let rows=`<row r="1" ht="26" customHeight="1">`+cab.map((_,c)=>cel(1,c,c?"":titulo,1)).join("")+`</row><row r="2"/>`;
  rows+=`<row r="3" ht="24" customHeight="1">`+cab.map((v,c)=>cel(3,c,v,2)).join("")+`</row>`;
  linhas.forEach((l,i)=>{const r=4+i;rows+=`<row r="${r}">`+l.map((v,c)=>cel(r,c,v,i%2?4:3)).join("")+`</row>`;});
  const NS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"',H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const W=larguras.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("");
  const sheet=`${H}<worksheet ${NS}><sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="3" topLeftCell="A4" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${W}</cols><sheetData>${rows}</sheetData><autoFilter ref="A3:${L[nc-1]}${ult}"/><mergeCells count="1"><mergeCell ref="A1:${L[nc-1]}1"/></mergeCells></worksheet>`;
  const fill=c=>`<fill><patternFill patternType="solid"><fgColor rgb="FF${c}"/><bgColor indexed="64"/></patternFill></fill>`;
  const bd=`<border><left style="thin"><color rgb="FF000000"/></left><right style="thin"><color rgb="FF000000"/></right><top style="thin"><color rgb="FF000000"/></top><bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/></border>`;
  const xf=(f,fi,b,h)=>`<xf numFmtId="0" fontId="${f}" fillId="${fi}" borderId="${b}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="${h}" vertical="center"/></xf>`;
  const styles=`${H}<styleSheet ${NS}><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><color rgb="FFB9D406"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFB9D406"/><name val="Calibri"/></font></fonts><fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fill("000000")}${fill("FFFFFF")}${fill("EEF5B8")}</fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${bd}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${xf(1,2,0,"left")}${xf(2,2,1,"center")}${xf(0,3,1,"center")}${xf(0,4,1,"center")}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const wb=`${H}<workbook ${NS} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${X(folha)}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${X(folha)}'!$A$3:$${L[nc-1]}$${ult}</definedName></definedNames></workbook>`;
  const R="http://schemas.openxmlformats.org/officeDocument/2006/relationships",P="http://schemas.openxmlformats.org/package/2006/relationships";
  const ct=`${H}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const rels=`${H}<Relationships xmlns="${P}"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const wrels=`${H}<Relationships xmlns="${P}"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/styles" Target="styles.xml"/></Relationships>`;
  const e=new TextEncoder();
  return zipStore([["[Content_Types].xml",e.encode(ct)],["_rels/.rels",e.encode(rels)],["xl/workbook.xml",e.encode(wb)],["xl/_rels/workbook.xml.rels",e.encode(wrels)],["xl/styles.xml",e.encode(styles)],["xl/worksheets/sheet1.xml",e.encode(sheet)]]);
}
function gerarExcel(dia){
  const ch=BD.c[dia]||{},sa=BD.s[dia]||{};
  if(!Object.keys(ch).length&&!Object.keys(sa).length)return null;
  const [y,m,d]=dia.split("-");
  const h=x=>{const r=reg(x);return r?hora(r.t):"";};
  const linhas=VOLTAS_TODAS.map(v=>[/^\d+$/.test(v)?+v:v,h(ch[v]),h(sa[v])]);
  return {bytes:criarXlsx({titulo:"CHEGADAS E SAÍDAS — "+d+"/"+m+"/"+y,folha:"Chegadas e saídas",cab:["Volta","Hora de chegada","Hora de saída"],linhas,larguras:[12,20,20]}),nome:`chegadas-saidas-${y}-${m}-${d}.xlsx`};
}
$("excel").onclick=()=>{
  try{
    const x=gerarExcel($("dia").value||hoje());
    if(!x){msg("msgX","Ainda não há chegadas nem saídas registadas neste dia.",false);return;}
    const url=URL.createObjectURL(new Blob([x.bytes],{type:MIME_XLSX}));
    const a=document.createElement("a");a.href=url;a.download=x.nome;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
    msg("msgX","Excel gerado: "+x.nome+" (ver em Transferências).",true);
  }catch(err){msg("msgX","Não foi possível gerar o Excel.",false);}
};
