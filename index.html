<style>
:root{--bg:#0c0f0d;--panel:#151a17;--panel-hi:#1c231f;--line:#26302a;--fg:#eef3ef;--muted:#93a39a;--green:#B9D406;
  --display:"Roboto Condensed","sans-serif-condensed","Arial Narrow",Arial,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
body{min-height:100dvh}
.top{background:#fff;border-bottom:6px solid var(--green);padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;display:flex;justify-content:center}
.top img{height:64px;max-width:80%;width:auto}
main{max-width:560px;margin:0 auto;padding:28px 16px 32px}
h1{font:700 34px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;text-align:center;margin:0;text-wrap:balance}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:24px}
.app{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;text-align:center;padding:22px 12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--fg);text-decoration:none;min-height:156px;min-width:0}
.app:active{background:var(--panel-hi)}
.app:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.ico{width:72px;height:72px;border-radius:18px;background:#0a0a0a;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.app b{font:700 19px/1.15 var(--display);letter-spacing:.03em;text-transform:uppercase;overflow-wrap:normal;max-width:100%}
.app small{color:var(--muted);font-size:12px;line-height:1.3}
.sessao{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:14px;color:var(--muted)}
.sessao b{color:var(--fg)}
.sessao button{background:none;border:1px solid var(--line);color:var(--green);border-radius:8px;padding:8px 12px;font:600 14px var(--body);cursor:pointer;flex:none}
.entrar{margin-top:24px;display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.entrar h2{margin:0;font:700 20px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--green)}
.entrar p{margin:0;color:var(--muted);font-size:14px}
.entrar label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.entrar input,.entrar select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px;font:500 18px var(--body)}
.entrar input:focus-visible,.entrar select:focus-visible,.entrar button:focus-visible,.sessao button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.polos{display:flex;flex-wrap:wrap;gap:8px}
.polos button{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:11px 16px;font:600 16px var(--body);cursor:pointer}
.polos button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#0a0a0a}
.entrar .ok{border:0;border-radius:10px;padding:15px;font:700 19px var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--green);color:#0a0a0a;cursor:pointer}
.entrar .ok:disabled{opacity:.6}
.msgE{min-height:20px;font-size:14px;color:#e0574f}.msgE.info{color:var(--muted)}
.rodape{max-width:560px;margin:0 auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px;line-height:1.5;white-space:nowrap;overflow:hidden}
</style>
</head>
<body>

<main>
  <h1>Operações SJT</h1>
  <div class="sessao" id="sessao" hidden><span id="sessaoTxt"></span><button type="button" id="mudar">Mudar</button></div>
  <form class="entrar" id="entrar" hidden novalidate>
    <h2>Entrar</h2>
    <p id="entrarDica">Escolha o seu armazém e escreva o código que lhe deram. Só é preciso fazer isto uma vez neste telemóvel.</p>
    <div><div class="lbl" style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px" id="l-polo">Armazém</div>
      <div class="polos" id="polos" role="group" aria-labelledby="l-polo"><span class="msgE info">A carregar armazéns…</span></div></div>
    <label for="codigo">Código do armazém<input id="codigo" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label for="nome">O seu nome<input id="nome" autocomplete="name" maxlength="40" placeholder="ex. Fábio Lopes"></label>
    <button class="ok" id="btnEntrar" type="submit">Entrar</button>
    <div class="msgE" id="msgE" role="status"></div>
  </form>
  <nav class="apps" id="apps" aria-label="Aplicações"></nav>
</main>
<footer class="rodape">© <span id="ano">2026</span> OPS CARF · Aplicação em desenvolvimento</footer>
<script src="sjt-online.js"></script>
<script>
/* Para juntar uma nova aplicação ao hub, acrescentar uma linha a esta lista. */
const ICONE_PNEU='<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#B9D406" stroke-linecap="round"><circle cx="24" cy="24" r="18" stroke-width="7"/><circle cx="24" cy="24" r="9.5" stroke-width="2.5"/><path stroke-width="2.2" d="M24 24V14.5M24 24l9-2.8M24 24l5.3 7.3M24 24l-5.3 7.3M24 24l-9-2.8"/><circle cx="24" cy="24" r="2.6" fill="#B9D406" stroke="none"/></svg>';
const ICONE_CHEGADA='<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#B9D406" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h22v18H4zM26 20h8l6 6v6H26z"/><circle cx="12" cy="34" r="3.5" fill="#0a0a0a"/><circle cx="33" cy="34" r="3.5" fill="#0a0a0a"/><path d="M10 23l4 4 7-8"/></svg>';
const ICONE_PENAL='<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#B9D406" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6L44 40H4z"/><path d="M24 18v11" stroke-width="3.4"/><circle cx="24" cy="34.5" r="2" fill="#B9D406" stroke="none"/></svg>';
const ICONE_FROTA='<svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#B9D406" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 34V12.5Q3 10 5.5 10H30.5L37.5 20.5L43 22.8Q45 23.6 45 25.8V34Z"/><path d="M31.5 13.5L35.7 20.3H30.8V13.5Z" stroke-width="1.8"/><path d="M28.5 13.5V30.5M17 13.5V30.5" stroke-width="1.8"/><path d="M40.5 26.5h3" stroke-width="2.2"/><circle cx="11.5" cy="34" r="4.6" fill="#0a0a0a"/><circle cx="11.5" cy="34" r="1.4" fill="#B9D406" stroke="none"/><circle cx="36" cy="34" r="4.6" fill="#0a0a0a"/><circle cx="36" cy="34" r="1.4" fill="#B9D406" stroke="none"/></svg>';
const APPS=[
  {nome:"Pneus em Falta",desc:"Registo de pneus em armazém por volta e guia",href:"pneus.html",icone:ICONE_PNEU},
  {nome:"Chegadas e Saídas",desc:"Horas de chegada e saída de cada volta",href:"chegadas.html",icone:ICONE_CHEGADA},
  {nome:"Penalizações",desc:"Registo de penalizações por volta e motorista",href:"penalizacoes.html",icone:ICONE_PENAL},
  {nome:"Frota",desc:"Viaturas, pedidos de intervenção e revisão",href:"frota.html",icone:ICONE_FROTA}
];
document.getElementById("ano").textContent=new Date().getFullYear();
function caberRodape(){const r=document.querySelector(".rodape");if(!r)return;r.style.fontSize="";let f=12;while(r.scrollWidth>r.clientWidth&&f>8){f-=.5;r.style.fontSize=f+"px";}}
caberRodape();addEventListener("resize",caberRodape);
const el=document.getElementById("apps");
APPS.forEach(a=>{
  const l=document.createElement("a");l.className="app";l.href=a.href;
  l.innerHTML='<span class="ico">'+a.icone+'</span>';
  const b=document.createElement("b");b.textContent=a.nome;
  const s=document.createElement("small");s.textContent=a.desc;
  l.append(b,s);el.appendChild(l);
});
/* Nomes compridos: reduz a letra até cada palavra caber no cartão */
function ajustar(){document.querySelectorAll(".app b").forEach(b=>{b.style.fontSize="";let f=19;while(b.scrollWidth>b.clientWidth&&f>13){f--;b.style.fontSize=f+"px";}});}
ajustar();addEventListener("resize",ajustar);
/* ---- Entrada: armazém + código + nome ---- */
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let poloEscolhido="";
function mostrarSessao(){
  const s=SJT.sessao(),dentro=!!(s&&s.token);
  $("sessao").hidden=!dentro;$("entrar").hidden=dentro;$("apps").hidden=!dentro;
  if(dentro){$("sessaoTxt").textContent="";const b=document.createElement("b");b.textContent=s.polo.nome;$("sessaoTxt").append("Armazém ",b," · "+s.nome);ajustar();}
  else abrirEntrada();
}
async function abrirEntrada(){
  const ult=SJT.ler("sjt_ultimo",null)||{};
  if(ult.nome&&!$("nome").value)$("nome").value=ult.nome;
  if(params.get("motivo")==="expirou")msgE("A sessão terminou (o código do armazém pode ter mudado). Entre de novo.",false);
  const g=$("polos");
  try{
    const j=await SJT.pedido("/polos",{tempo:10000});
    g.textContent="";
    if(!j.polos.length){g.innerHTML='<span class="msgE info">Ainda não há armazéns criados.</span>';return;}
    j.polos.forEach(p=>{const b=document.createElement("button");b.type="button";b.textContent=p.nome;b.dataset.id=p.id;b.setAttribute("aria-pressed","false");
      b.onclick=()=>{poloEscolhido=p.id;g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));$("codigo").focus();};g.appendChild(b);});
    const pre=j.polos.find(p=>p.id===ult.polo)||(j.polos.length===1?j.polos[0]:null);
    if(pre){poloEscolhido=pre.id;g.querySelector('[data-id="'+pre.id+'"]').setAttribute("aria-pressed","true");}
  }catch(e){g.innerHTML="";const m=document.createElement("span");m.className="msgE";m.textContent=e.codigo==="rede"?"Sem internet. Para entrar pela primeira vez é preciso rede.":e.message;g.appendChild(m);
    const t=document.createElement("button");t.type="button";t.textContent="Tentar de novo";t.onclick=abrirEntrada;g.appendChild(t);}
}
function msgE(t,info){$("msgE").textContent=t||"";$("msgE").className="msgE"+(info?" info":"");}
$("entrar").addEventListener("submit",async e=>{
  e.preventDefault();
  const codigo=$("codigo").value.trim(),nome=$("nome").value.replace(/\s+/g," ").trim();
  const falta=[];if(!poloEscolhido)falta.push("o armazém");if(!codigo)falta.push("o código");if(!nome)falta.push("o seu nome");
  if(falta.length){msgE("Falta indicar "+falta.join(", ").replace(/, ([^,]*)$/," e $1")+".");return;}
  $("btnEntrar").disabled=true;msgE("A entrar…",true);
  try{
    await SJT.entrar(poloEscolhido,codigo,nome);
    $("codigo").value="";msgE("");
    const volta=params.get("entrar");
    if(volta&&/^[a-z]+\.html$/.test(volta)){location.replace(volta);return;}
    history.replaceState(null,"",location.pathname);mostrarSessao();
  }catch(err){msgE(err.message);}
  $("btnEntrar").disabled=false;
});
let confirmarSair=false;
$("mudar").onclick=()=>{
  if(!confirmarSair){confirmarSair=true;$("mudar").textContent="Sair?";setTimeout(()=>{confirmarSair=false;$("mudar").textContent="Mudar";},4000);return;}
  SJT.sair();confirmarSair=false;$("mudar").textContent="Mudar";mostrarSessao();
};
mostrarSessao();
SJT.atualizarSessao().then(s=>{if(s)mostrarSessao();});
if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
