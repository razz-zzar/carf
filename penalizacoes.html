<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f0d">
<meta name="application-name" content="OPS CARF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Penalizações</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="carf-icon-192.png">
<link rel="apple-touch-icon" href="carf-icon-192.png">
<style>
/* Layout: formulário em cima (campos automáticos marcados "auto", sempre editáveis), resumo para confirmar antes de gravar, registos do dia, exportação */
:root{
  --bg:#0c0f0d; --panel:#151a17; --line:#26302a; --fg:#eef3ef; --muted:#93a39a;
  --green:#B9D406; --green-dk:#94aa05; --green-ink:#0a0a0a; --danger:#e0574f;
  --display:"Roboto Condensed","sans-serif-condensed","Arial Narrow",Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:0 40px}
body.preso{overflow:hidden}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{padding-block:calc(14px + env(safe-area-inset-top,0px)) 12px;border-bottom:2px solid var(--green);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:40px;width:auto;max-width:42%;background:#fff;border-radius:8px;padding:5px 8px;flex:none}
h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.voltar{display:inline-flex;align-items:center;min-height:36px;color:var(--green);font:600 15px var(--body);text-decoration:none;letter-spacing:.02em}
.datebox input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:500 14px var(--mono)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0;color:var(--green);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 span{font:600 15px var(--mono);color:var(--muted)}
.par{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.campo label i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400}
.auto{font:700 10px var(--body);letter-spacing:.08em;background:var(--green);color:var(--green-ink);border-radius:4px;padding:2px 5px}
.campo input,.campo select,.campo textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px;font:500 18px var(--body);min-height:50px}
.campo textarea{font-size:17px;min-height:84px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--green);outline:none}
.campo input.mono{font-family:var(--mono);font-weight:600}
.campo.erro input,.campo.erro select{border-color:var(--danger)}
.eur{position:relative}
.eur input{padding-right:38px}
.eur::after{content:"€";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font:600 18px var(--body);pointer-events:none}
.eur.txt::after{content:none}
.nota{font-size:13px;color:var(--muted)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--green) 50%),linear-gradient(135deg,var(--green) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px!important}
.aviso{font-size:14px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px}
.registar{border:0;border-radius:10px;padding:16px;font:700 21px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;background:var(--green);color:var(--green-ink)}
.registar:active{background:var(--green-dk)}
.registar:disabled{background:var(--line);color:var(--muted);cursor:default}
#lista{display:flex;flex-direction:column;gap:8px}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 14px}
.r .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.r .vol{font:700 22px/1 var(--display);letter-spacing:.03em;overflow-wrap:anywhere}
.r .vol small{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.r .sub{font:600 13px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.r .val{font:600 15px var(--mono);color:var(--green)}
.r .mot{font-size:15px;overflow-wrap:anywhere}
.r .mtr{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.r .obs{font-size:14px;border-left:2px solid var(--line);padding-left:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.r .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.anular{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:10px 12px;font:600 13px var(--body);cursor:pointer}
.anular.confirm{border-color:var(--danger);color:var(--danger)}
.vazio{font-size:14px;color:var(--muted)}
.btn{border-radius:10px;padding:16px;font:700 20px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--green);border:2px solid var(--green)}
.msg{font-size:14px;min-height:20px}
.msg.ok{color:var(--green)} .msg.err{color:var(--danger)}
.hint{font-size:13px;color:var(--muted)}
/* Semana */
.semana{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px;align-items:stretch}
.semana button{background:var(--bg);color:var(--green);border:1px solid var(--line);border-radius:10px;font:700 26px var(--display);cursor:pointer;min-height:52px}
.semana button:disabled{color:var(--line);cursor:default}
.sem-txt{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px}
.sem-txt b{font:700 17px var(--display);letter-spacing:.05em;text-transform:uppercase}
.sem-txt span{font:500 13px var(--mono);color:var(--muted)}
.hoje-btn{background:none;border:0;color:var(--green);font:600 14px var(--body);cursor:pointer;padding:4px;justify-self:center}
.sem-tot{display:flex;gap:12px}
.sem-tot div{flex:1;border-left:3px solid var(--green);padding-left:10px}
.sem-tot b{display:block;font:600 24px var(--mono)}
.sem-tot span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dia-h{font:700 14px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px;display:flex;justify-content:space-between}
.dia-h:first-child{margin-top:0}
/* Email */
.mcampo{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"rot btn" "val btn";column-gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 12px}
.mrot{grid-area:rot;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mval{grid-area:val;font-size:15px;overflow-wrap:anywhere;user-select:all}
.mcop{grid-area:btn;background:none;border:1px solid var(--green);color:var(--green);border-radius:8px;padding:10px 14px;font:600 14px var(--body);cursor:pointer;min-width:84px}
.mcop.ok{background:var(--green);color:var(--green-ink)}
.mnota{font-size:13px;color:var(--muted)}
#email{margin-bottom:2px}
/* Resumo antes de gravar */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.resumo{width:100%;max-width:560px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--green);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.resumo dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:baseline}
.resumo dt{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.resumo dd{margin:0;font-size:17px;overflow-wrap:anywhere;white-space:pre-wrap}
.resumo dd.forte{font:700 22px var(--display);letter-spacing:.03em}
.resumo dd.din{font:600 18px var(--mono);color:var(--green)}
.resumo .acoes{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.resumo .btn{padding:14px 10px;font-size:18px}
.resumo .registar{padding:14px 10px;font-size:18px}
</style>
</head>

    </div>
  </header>

  <section class="card" aria-labelledby="t-novo">
    <h2 id="t-novo">Nova penalização</h2>
    <div class="par">
      <div class="campo" id="c-volta">
        <label for="volta">Volta</label>
        <input type="text" id="volta" class="mono" inputmode="numeric" autocomplete="off" list="voltas" placeholder="ex. 1123">
        <datalist id="voltas"></datalist>
      </div>
      <div class="campo" id="c-sub">
        <label for="sub">Subcontratado <span class="auto" id="a-sub" hidden>AUTO</span></label>
        <input type="text" id="sub" autocomplete="off" list="prestadores" placeholder="Prestador">
        <datalist id="prestadores"></datalist>
      </div>
    </div>
    <div class="campo" id="c-motorista">
      <label for="motorista">Motorista</label>
      <input type="text" id="motorista" autocomplete="off" autocapitalize="words" list="motoristas" placeholder="Nome do motorista">
      <datalist id="motoristas"></datalist>
    </div>
    <div class="campo" id="c-motivo">
      <label for="motivo">Motivo</label>
      <select id="motivo"><option value="">Escolha o motivo</option></select>
    </div>
    <div class="campo" id="c-reemb" hidden>
      <label for="reemb">Valor do reembolso</label>
      <div class="eur"><input type="text" id="reemb" class="mono" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
      <div class="nota">A penalização é o reembolso + 25%.</div>
    </div>
    <div class="campo" id="c-valor">
      <label for="valor">Valor da penalização <span class="auto" id="a-valor" hidden>AUTO</span></label>
      <div class="eur" id="eur-valor"><input type="text" id="valor" class="mono" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
    </div>
    <div class="campo">
      <label for="obs">Observações <i>(opcional)</i></label>
      <textarea id="obs" rows="3" placeholder="Detalhes da penalização"></textarea>
    </div>
    <button class="registar" id="registar" type="button">Rever e registar</button>
    <div class="msg" id="msg" role="status"></div>
  </section>

  <section class="card" aria-labelledby="t-lista">
    <h2 id="t-lista">Penalizações da semana <span id="total">0</span></h2>
    <div class="semana" role="group" aria-label="Semana">
      <button type="button" id="semAnt" aria-label="Semana anterior">‹</button>
      <div class="sem-txt"><b id="semNum"></b><span id="semDatas"></span></div>
      <button type="button" id="semSeg" aria-label="Semana seguinte">›</button>
    </div>
    <button type="button" class="hoje-btn" id="semHoje" hidden>Voltar à semana atual</button>
    <div class="sem-tot" id="semTot"></div>
    <div id="lista"></div>
    <div class="hint">Os registos são partilhados com todo o armazém. Sem internet ficam no telemóvel e são enviados quando a rede voltar.</div>
  </section>

  <section class="card">
    <button class="registar" id="email" type="button">Enviar por email</button>
    <button class="btn" id="excel" type="button">Descarregar Excel da semana</button>
    <div class="msg" id="msgX" role="status"></div>
  </section>
</div>

<div class="veu" id="mail" hidden>

    <div class="mcampo" id="mParaCx"><div class="mrot">Para</div><div class="mval" id="mPara"></div><button type="button" class="mcop" id="mCopPara">Copiar</button></div>

    <div class="mnota" id="mNota"></div>
    <button class="registar" id="mAbrir" type="button">Abrir email com o ficheiro</button>
    <div class="acoes"><button class="btn" id="mFechar" type="button">Fechar</button><button class="btn" id="mXlsx" type="button">Descarregar Excel</button></div>
    <div class="msg" id="mMsg" role="status"></div>
  </div>
</div>

<div class="veu" id="veu" hidden>
  <div class="resumo" role="dialog" aria-modal="true" aria-labelledby="t-res">
    <h2 id="t-res">Confirmar penalização</h2>
    <dl id="resumo"></dl>
    <div class="acoes">
      <button class="btn" id="corrigir" type="button">Corrigir</button>
      <button class="registar" id="gravar" type="button">Gravar</button>
    </div>
  </div>
</div>

<script src="sjt-online.js"></script>
<script>
const S=SJT.exigirSessao();
/* Tabela de penalizações. valor: número em € | "nao_pago" (serviço não pago) | "reembolso" (reembolso + 25%) */
const MOTIVOS=SJT.lista("motivos",S);
const NAO_PAGO="Serviço não pago";
/* Matriz volta → subcontratado (prestador) */
const MATRIZ=SJT.lista("matriz",S);

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const diaDe=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoje=()=>diaDe(new Date());
const hora=iso=>{const d=new Date(iso);return pad(d.getHours())+":"+pad(d.getMinutes());};
const num=s=>{const t=String(s||"").replace(/\s|€/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".");return /^\d+(\.\d+)?$/.test(t)?+t:null;};
const eur=n=>n.toLocaleString("pt-PT",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+" €";
const motivoDe=m=>MOTIVOS.find(x=>x[0]===m);

/* BD: { "AAAA-MM-DD": [ {id, t, volta, sub, motorista, motivo, valor (número ou texto), reemb, obs} ] } */
let BD={},aConfirmar=null,pendente=null;
/* Semanas de segunda a domingo; semana = data da segunda-feira (AAAA-MM-DD) */
const dataDe=dia=>{const [y,m,d]=dia.split("-").map(Number);return new Date(y,m-1,d);};
function segundaDe(dia){const d=dataDe(dia);d.setDate(d.getDate()-((d.getDay()+6)%7));return diaDe(d);}
const somaDias=(dia,n)=>{const d=dataDe(dia);d.setDate(d.getDate()+n);return diaDe(d);};
function numSemana(dia){const d=dataDe(dia);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const j=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-j)/86400000-3+((j.getDay()+6)%7))/7);}
const ddmm=dia=>{const [y,m,d]=dia.split("-");return d+"/"+m;};
let semana=segundaDe(hoje());
const diasDaSemana=s=>Array.from({length:7},(_,i)=>somaDias(s,i));
const daSemana=s=>diasDaSemana(s).flatMap(d=>(BD[d]||[]).map(r=>({...r,dia:d})));
const NOMES_DIA=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
/* Penalizações partilhadas pelo armazém (ver sjt-online.js) */
const LIG=SJT.ligar("penalizacoes",{diasLocais:0,aoMudar:()=>{carregar();sugerirMotoristas();render();}});
function carregar(){BD={};LIG.registos().forEach(r=>{(BD[r.dia]=BD[r.dia]||[]).push({...r.dados,id:r.id,autor:r.autor,meu:r.meu,alteradoPor:r.alteradoPor,pendente:!!r.pendente});});}
carregar();
function msg(id,t,ok){const m=$(id);m.textContent=t||"";m.className="msg "+(ok?"ok":"err");}
const opt=(dl,v,txt)=>{const o=document.createElement("option");o.value=v;if(txt)o.textContent=txt;dl.appendChild(o);};

MOTIVOS.forEach(([m,v])=>opt($("motivo"),m,m));
Object.keys(MATRIZ).sort().forEach(v=>opt($("voltas"),v));
[...new Set(Object.values(MATRIZ))].sort((a,b)=>a.localeCompare(b,"pt")).forEach(p=>opt($("prestadores"),p));
function sugerirMotoristas(){
  const nomes=new Set();Object.values(BD).forEach(l=>l.forEach(r=>r.motorista&&nomes.add(r.motorista)));
  const dl=$("motoristas");dl.textContent="";[...nomes].sort((a,b)=>a.localeCompare(b,"pt")).forEach(n=>opt(dl,n));
}

/* Preenchimento automático: só substitui o campo se ainda tiver o valor que a app lá pôs (ou estiver vazio) */
const AUTO={sub:"",valor:""};
function autoPor(campo,v){
  const el=$(campo),livre=el.value.trim()===""||el.value===AUTO[campo];
  if(livre){el.value=v;AUTO[campo]=v;}
  marcarAuto(campo);
}
function marcarAuto(campo){$("a-"+campo).hidden=!($(campo).value&&$(campo).value===AUTO[campo]);}

$("volta").addEventListener("input",()=>{autoPor("sub",MATRIZ[$("volta").value.trim()]||"");});
$("sub").addEventListener("input",()=>marcarAuto("sub"));
$("valor").addEventListener("input",()=>{marcarAuto("valor");$("eur-valor").classList.toggle("txt",num($("valor").value)===null&&$("valor").value.trim()!=="");});
function valorDoMotivo(){
  const m=motivoDe($("motivo").value),tipo=m?m[1]:null;
  $("c-reemb").hidden=tipo!=="reembolso";
  let v="";
  if(typeof tipo==="number")v=String(tipo);
  else if(tipo==="nao_pago")v=NAO_PAGO;
  else if(tipo==="reembolso"){const r=num($("reemb").value);v=r===null?"":String(Math.round(r*125)/100).replace(".",",");}
  autoPor("valor",v);
  $("eur-valor").classList.toggle("txt",tipo==="nao_pago"&&$("valor").value===NAO_PAGO);
}
$("motivo").addEventListener("change",valorDoMotivo);
$("reemb").addEventListener("input",valorDoMotivo);
["volta","sub","motorista","motivo","valor","reemb"].forEach(k=>$(k).addEventListener("input",()=>{const c=$("c-"+k);c&&c.classList.remove("erro");}));
$("motivo").addEventListener("change",()=>$("c-motivo").classList.remove("erro"));

function irSemana(s){semana=s;aConfirmar=null;msg("msgX","");render();}
$("semAnt").onclick=()=>irSemana(somaDias(semana,-7));
$("semSeg").onclick=()=>irSemana(somaDias(semana,7));
$("semHoje").onclick=()=>irSemana(segundaDe(hoje()));

const CAMPOS=["volta","sub","motorista","motivo","reemb","valor","obs"];
function render(){
  const atual=segundaDe(hoje()),fim=somaDias(semana,6);
  $("semNum").textContent="Semana "+numSemana(semana)+(semana===atual?" · esta semana":"");
  $("semDatas").textContent=ddmm(semana)+" a "+ddmm(fim)+"/"+fim.slice(0,4);
  $("semSeg").disabled=semana>=atual;$("semHoje").hidden=semana===atual;
  const l=daSemana(semana);
  const soma=l.reduce((a,r)=>a+(typeof r.valor==="number"?r.valor:0),0),naoPago=l.filter(r=>typeof r.valor!=="number").length;
  $("total").textContent=l.length;
  $("semTot").innerHTML="";
  [[l.length,"Penalizações"],[eur(soma),"Total"+(naoPago?" (+"+naoPago+" sem valor)":"")]].forEach(([v,t])=>{const d=document.createElement("div");const b=document.createElement("b");b.textContent=v;const s=document.createElement("span");s.textContent=t;d.append(b,s);$("semTot").appendChild(d);});
  const el=$("lista");el.textContent="";
  if(!l.length){const p=document.createElement("div");p.className="vazio";p.textContent="Sem penalizações registadas nesta semana.";el.appendChild(p);return;}
  /* agrupadas por dia, do mais recente para o mais antigo */
  diasDaSemana(semana).reverse().forEach(dia=>{
    const ld=(BD[dia]||[]).slice().sort((a,b)=>b.t.localeCompare(a.t));
    if(!ld.length)return;
    const h=document.createElement("div");h.className="dia-h";const nd=dataDe(dia);
    h.innerHTML="";const e1=document.createElement("span");e1.textContent=NOMES_DIA[nd.getDay()]+", "+ddmm(dia);const e2=document.createElement("span");e2.textContent=ld.length+" penalizaç"+(ld.length===1?"ão":"ões");h.append(e1,e2);el.appendChild(h);
    ld.forEach(r=>el.appendChild(linha(r)));
  });
}
function linha(r){
    const row=document.createElement("div");row.className="r";
    const info=document.createElement("div");info.className="info";
    const top=document.createElement("div");top.className="top";
    const v=document.createElement("span");v.className="vol";v.innerHTML="<small>Volta</small>";v.append(r.volta);
    top.appendChild(v);
    if(r.sub){const s=document.createElement("span");s.className="sub";s.textContent=r.sub;top.appendChild(s);}
    if(r.valor!==undefined&&r.valor!==""){const s=document.createElement("span");s.className="val";s.textContent=typeof r.valor==="number"?eur(r.valor):r.valor;top.appendChild(s);}
    const m=document.createElement("div");m.className="mot";m.textContent=r.motivo;
    const mt=document.createElement("div");mt.className="mtr";mt.textContent=r.motorista+" · "+hora(r.t);
    const au=document.createElement("div");au.className="sjt-autor";au.textContent="Registado por "+SJT.autorTxt(r)+(r.pendente?" · a enviar":"");
    info.append(top,m,mt,au);
    if(r.obs){const o=document.createElement("div");o.className="obs";o.textContent=r.obs;info.appendChild(o);}
    const b=document.createElement("button");b.type="button";b.className="anular"+(aConfirmar===r.id?" confirm":"");
    b.textContent=aConfirmar===r.id?"Confirmar":"Apagar";b.hidden=!r.meu;b.onclick=()=>apagar(r.id);
    b.setAttribute("aria-label",(aConfirmar===r.id?"Confirmar apagar":"Apagar")+" penalização da volta "+r.volta);
    row.append(info,b);return row;
}

/* 1.º passo: validar e mostrar o resumo */
$("registar").onclick=()=>{
  const g=k=>$(k).value.trim();
  const volta=g("volta"),sub=g("sub"),motorista=g("motorista").replace(/\s+/g," "),motivo=$("motivo").value,vTxt=g("valor"),obs=g("obs");
  const m=motivoDe(motivo),eReemb=m&&m[1]==="reembolso",reemb=eReemb?num(g("reemb")):null;
  const falta=[],marca=k=>$("c-"+k).classList.add("erro");
  if(!volta){falta.push("a volta");marca("volta");}
  if(!sub){falta.push("o subcontratado");marca("sub");}
  if(!motorista){falta.push("o motorista");marca("motorista");}
  if(!motivo){falta.push("o motivo");marca("motivo");}
  if(!vTxt){falta.push("o valor");marca("valor");}
  if(falta.length){msg("msg","Falta indicar "+falta.join(", ").replace(/, ([^,]*)$/," e $1")+".",false);return;}
  if(eReemb&&g("reemb")&&reemb===null){marca("reemb");msg("msg","O valor do reembolso não é um número válido.",false);return;}
  const vNum=num(vTxt),valor=vNum!==null?vNum:vTxt;
  pendente={volta,sub,motorista,motivo,valor,obs};if(reemb!==null)pendente.reemb=reemb;
  msg("msg","");
  const dl=$("resumo");dl.textContent="";
  const linha=(t,v,c)=>{const a=document.createElement("dt");a.textContent=t;const b=document.createElement("dd");b.textContent=v;if(c)b.className=c;dl.append(a,b);};
  linha("Dia",new Date().toLocaleDateString("pt-PT"));
  linha("Volta",volta,"forte");
  linha("Subcontratado",sub);
  linha("Motorista",motorista);
  linha("Motivo",motivo);
  if(reemb!==null)linha("Reembolso",eur(reemb));
  linha("Valor",typeof valor==="number"?eur(valor):valor,"din");
  if(obs)linha("Observações",obs);
  $("veu").hidden=false;document.body.classList.add("preso");$("gravar").focus();
};
function fecharResumo(){$("veu").hidden=true;document.body.classList.remove("preso");}
$("corrigir").onclick=()=>{fecharResumo();pendente=null;$("volta").focus();};
$("veu").addEventListener("click",e=>{if(e.target===$("veu"))$("corrigir").click();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("veu").hidden)$("corrigir").click();});

/* 2.º passo: gravar */
$("gravar").onclick=()=>{
  if(!pendente)return;
  const agora=new Date(),dia=diaDe(agora);
  semana=segundaDe(dia);
  const r={id:agora.getTime().toString(36)+Math.random().toString(36).slice(2,6)+SJT.dispositivo().replace(/[^a-z0-9]/gi,"").slice(0,4),t:agora.toISOString(),...pendente};
  if(!LIG.gravar(r.id,dia,r)){fecharResumo();msg("msg","O telemóvel não deixou guardar (sem espaço ou armazenamento bloqueado).",false);return;}
  carregar();
  fecharResumo();pendente=null;
  CAMPOS.forEach(k=>$(k).value="");AUTO.sub="";AUTO.valor="";marcarAuto("sub");marcarAuto("valor");
  $("c-reemb").hidden=true;$("eur-valor").classList.remove("txt");
  aConfirmar=null;msg("msg","Penalização registada: volta "+r.volta+", "+r.motivo+".",true);
  sugerirMotoristas();render();
};

function apagar(id){
  if(aConfirmar!==id){aConfirmar=id;render();setTimeout(()=>{if(aConfirmar===id){aConfirmar=null;render();}},4000);return;}
  aConfirmar=null;
  if(!LIG.apagar(id)){msg("msg","Só quem registou a penalização a pode apagar.",false);render();return;}
  carregar();sugerirMotoristas();msg("msg","Penalização apagada.",true);render();
}

/* Se a app ficar aberta e mudar a semana (segunda-feira à meia-noite), passa para a nova semana */
let semAtual=segundaDe(hoje());
function virarSemana(){const s=segundaDe(hoje());if(s!==semAtual){if(semana===semAtual)semana=s;semAtual=s;render();}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")virarSemana();});
setInterval(virarSemana,60000);

/* Gerador mínimo de .xlsx (sem bibliotecas, funciona offline) */
const MIME_XLSX="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const [name,data] of files){
    const nb=enc.encode(name),crc=crc32(data);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,data);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+data.length;
  }
  const cdSize=central.reduce((a,p)=>a+p.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  const all=[...parts,...central,end],out=new Uint8Array(all.reduce((a,p)=>a+p.length,0));let o=0;
  for(const p of all){out.set(p,o);o+=p.length;}return out;
}
function criarXlsx({titulo,folha,cab,linhas,larguras}){
  const X=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const L="ABCDEFGH",nc=cab.length,ult=3+linhas.length;
  const cel=(r,c,v,s)=>v===""||v==null?`<c r="${L[c]}${r}" s="${s}"/>`:typeof v==="number"?`<c r="${L[c]}${r}" s="${s}"><v>${v}</v></c>`:`<c r="${L[c]}${r}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`;
  let rows=`<row r="1" ht="26" customHeight="1">`+cab.map((_,c)=>cel(1,c,c?"":titulo,1)).join("")+`</row><row r="2"/>`;
  rows+=`<row r="3" ht="24" customHeight="1">`+cab.map((v,c)=>cel(3,c,v,2)).join("")+`</row>`;
  linhas.forEach((l,i)=>{const r=4+i;rows+=`<row r="${r}">`+l.map((v,c)=>cel(r,c,v,i%2?4:3)).join("")+`</row>`;});
  const NS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"',H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const W=larguras.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("");
  const sheet=`${H}<worksheet ${NS}><sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="3" topLeftCell="A4" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${W}</cols><sheetData>${rows}</sheetData><autoFilter ref="A3:${L[nc-1]}${ult}"/><mergeCells count="1"><mergeCell ref="A1:${L[nc-1]}1"/></mergeCells></worksheet>`;
  const fill=c=>`<fill><patternFill patternType="solid"><fgColor rgb="FF${c}"/><bgColor indexed="64"/></patternFill></fill>`;
  const bd=`<border><left style="thin"><color rgb="FFC3CCBD"/></left><right style="thin"><color rgb="FFC3CCBD"/></right><top style="thin"><color rgb="FFC3CCBD"/></top><bottom style="thin"><color rgb="FFC3CCBD"/></bottom><diagonal/></border>`;
  const xf=(f,fi,b,h)=>`<xf numFmtId="0" fontId="${f}" fillId="${fi}" borderId="${b}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="${h}" vertical="center"/></xf>`;
  const styles=`${H}<styleSheet ${NS}><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><color rgb="FF1F3B2A"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FF1F3B2A"/><name val="Calibri"/></font></fonts><fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fill("E2EBD5")}${fill("FFFFFF")}${fill("F4F7EF")}</fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${bd}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${xf(1,2,0,"left")}${xf(2,2,1,"center")}${xf(0,3,1,"center")}${xf(0,4,1,"center")}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const wb=`${H}<workbook ${NS} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${X(folha)}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${X(folha)}'!$A$3:$${L[nc-1]}$${ult}</definedName></definedNames></workbook>`;
  const R="http://schemas.openxmlformats.org/officeDocument/2006/relationships",P="http://schemas.openxmlformats.org/package/2006/relationships";
  const ct=`${H}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const rels=`${H}<Relationships xmlns="${P}"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const wrels=`${H}<Relationships xmlns="${P}"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/styles" Target="styles.xml"/></Relationships>`;
  const e=new TextEncoder();
  return zipStore([["[Content_Types].xml",e.encode(ct)],["_rels/.rels",e.encode(rels)],["xl/workbook.xml",e.encode(wb)],["xl/_rels/workbook.xml.rels",e.encode(wrels)],["xl/styles.xml",e.encode(styles)],["xl/worksheets/sheet1.xml",e.encode(sheet)]]);
}
function linhasSemana(s){
  return daSemana(s).sort((a,b)=>a.t.localeCompare(b.t)).map(r=>{
    let obs=(r.obs||"").replace(/\s*\n\s*/g," ");
    if(typeof r.reemb==="number")obs=("Reembolso: "+eur(r.reemb)+" + 25%"+(obs?". "+obs:""));
    const val=r.valor===undefined?"":r.valor;
    return [ddmm(r.dia)+"/"+r.dia.slice(0,4),/^\d+$/.test(r.volta)?+r.volta:r.volta,r.sub||"",r.motorista,r.motivo,val,obs,r.autor||""];
  });
}
const CAB=["Data","Volta","Subcontratado","Motorista","Motivo","Valor (€)","Observações","Registado por"];
const nomeSemana=s=>"Semana "+numSemana(s)+" ("+ddmm(s)+" a "+ddmm(somaDias(s,6))+"/"+somaDias(s,6).slice(0,4)+")";
const ficheiroBase=s=>"penalizacoes-"+S.polo.nome.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w]+/g,"-").replace(/^-|-$/g,"").toLowerCase()+"-"+somaDias(s,3).slice(0,4)+"-S"+String(numSemana(s)).padStart(2,"0");
function gerarExcel(s){
  const linhas=linhasSemana(s);if(!linhas.length)return null;
  return {bytes:criarXlsx({titulo:"PENALIZAÇÕES — "+nomeSemana(s)+" — "+S.polo.nome,folha:"Penalizações",cab:CAB,linhas,larguras:[13,10,18,26,40,16,44,20]}),nome:ficheiroBase(s)+".xlsx"};
}
/* CSV (abre no Excel): a partilha do telemóvel só aceita certos tipos de ficheiro e o .xlsx não está entre eles */
function gerarCsv(s){
  const linhas=linhasSemana(s);if(!linhas.length)return null;
  const q=v=>{const t=typeof v==="number"?String(v).replace(".",","):String(v==null?"":v);return /[";\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
  const txt="﻿"+[CAB,...linhas].map(l=>l.map(q).join(";")).join("\r\n")+"\r\n";
  return {texto:txt,nome:ficheiroBase(s)+".csv"};
}
function descarregar(blob,nome){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);}
$("excel").onclick=()=>{
  try{
    const x=gerarExcel(semana);
    if(!x){msg("msgX","Não há penalizações nesta semana.",false);return;}
    descarregar(new Blob([x.bytes],{type:MIME_XLSX}),x.nome);
    msg("msgX","Excel gerado: "+x.nome+" (ver em Transferências).",true);
  }catch(err){msg("msgX","Não foi possível gerar o Excel.",false);}
};

/* ---- Enviar por email ---- */
async function copiar(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){return false;}}
function saudacao(){const h=new Date().getHours();return h<13?"Bom dia":h<20?"Boa tarde":"Boa noite";}
let mailAtual=null;
function textoMail(s){
  const l=daSemana(s),soma=l.reduce((a,r)=>a+(typeof r.valor==="number"?r.valor:0),0);
  const assunto="Penalizações | "+nomeSemana(s)+" | "+S.polo.nome;
  const corpo=[saudacao()+",","","Segue em anexo o ficheiro com as penalizações registadas no polo de "+S.polo.nome+" na "+nomeSemana(s).replace("Semana","semana")+".","",
    "Total de penalizações: "+l.length,"Valor total: "+eur(soma)+(l.some(r=>typeof r.valor!=="number")?" (há penalizações sem valor em euros, ver ficheiro)":""),""].join("\n");
  return {assunto,corpo};
}
$("email").onclick=()=>{
  if(!daSemana(semana).length){msg("msgX","Não há penalizações nesta semana para enviar.",false);return;}
  const {assunto,corpo}=textoMail(semana),para=((S.config||{}).emailPenalizacoes||"").trim();
  mailAtual={s:semana,assunto,corpo,para};
  $("mParaCx").hidden=!para;$("mPara").textContent=para;$("mAssunto").textContent=assunto;
  ["mCopPara","mCopAss"].forEach(k=>{$(k).textContent="Copiar";$(k).classList.remove("ok");});
  $("mNota").textContent="O ficheiro vai em CSV (abre diretamente no Excel): a partilha do telemóvel não aceita ficheiros .xlsx. Se precisar do Excel formatado, use Descarregar Excel e anexe-o. Ao abrir o email, o assunto fica copiado: se não aparecer, cole-o."+(para?"":" Este polo ainda não tem email para penalizações definido na gestão.");
  $("mMsg").textContent="";$("mail").hidden=false;document.body.classList.add("preso");$("mAbrir").focus();
};
function fecharMail(){$("mail").hidden=true;document.body.classList.remove("preso");}
$("mFechar").onclick=fecharMail;
$("mail").addEventListener("click",e=>{if(e.target===$("mail"))fecharMail();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("mail").hidden)fecharMail();});
async function botaoCopiar(id,txt){const ok=await copiar(txt);$(id).textContent=ok?"Copiado ✓":"Selecione";$(id).classList.toggle("ok",ok);
  ["mCopPara","mCopAss"].filter(k=>k!==id).forEach(k=>{$(k).textContent="Copiar";$(k).classList.remove("ok");});}
$("mCopPara").onclick=()=>botaoCopiar("mCopPara",mailAtual.para);
$("mCopAss").onclick=()=>botaoCopiar("mCopAss",mailAtual.assunto);
$("mXlsx").onclick=()=>{const x=gerarExcel(mailAtual.s);if(x){descarregar(new Blob([x.bytes],{type:MIME_XLSX}),x.nome);$("mMsg").textContent="Excel descarregado: "+x.nome+" (ver em Transferências).";$("mMsg").className="msg ok";}};
$("mAbrir").onclick=async()=>{
  const m=mailAtual;if(!m)return;
  const c=gerarCsv(m.s);if(!c)return;
  const fic=new File([c.texto],c.nome,{type:"text/csv"});
  let partilha=false;
  try{partilha=!!(navigator.share&&navigator.canShare&&navigator.canShare({files:[fic],title:m.assunto,text:m.corpo}));}catch(e){}
  const copiado=await copiar(m.assunto);
  if(copiado){$("mCopAss").textContent="Copiado ✓";$("mCopAss").classList.add("ok");}
  if(partilha){
    try{await navigator.share({title:m.assunto,text:m.corpo,files:[fic]});fecharMail();
      msg("msgX","Email preparado na app escolhida com o ficheiro "+c.nome+"."+(copiado?" O assunto foi copiado — cole-o se não aparecer.":"")+(m.para?" Destinatário: "+m.para+".":""),true);return;}
    catch(e){if(e&&e.name==="AbortError")return;}
  }
  /* sem partilha de ficheiros: descarrega o Excel e abre o email preenchido para anexar */
  const x=gerarExcel(m.s);if(x)descarregar(new Blob([x.bytes],{type:MIME_XLSX}),x.nome);
  const href="mailto:"+encodeURIComponent(m.para).replace(/%2C/gi,",").replace(/%40/g,"@")+"?subject="+encodeURIComponent(m.assunto)+"&body="+encodeURIComponent(m.corpo);
  setTimeout(()=>{const a=document.createElement("a");a.href=href;document.body.appendChild(a);a.click();a.remove();},500);
  fecharMail();msg("msgX","Email aberto com destinatário, assunto e texto. O Excel foi descarregado (ver Transferências): anexe-o ao email.",true);
};

/* Registos de antes do online, que ficaram neste telemóvel */
(()=>{const antigos=[];let o={};try{o=JSON.parse(localStorage.getItem("penalizacoes")||"{}")||{};}catch(e){}
  for(const [dia,l] of Object.entries(o))(l||[]).forEach(r=>{if(r&&r.id)antigos.push([dia,r]);});
  SJT.oferecerMigracao("penalizacoes",antigos.length,()=>{antigos.forEach(([dia,r])=>{const id="antigo-"+r.id+"-"+SJT.dispositivo().slice(0,6);if(!LIG.obter(id))LIG.gravar(id,dia,{...r,id});});carregar();sugerirMotoristas();render();},$("lista").closest("section")||document.querySelector("main"));})();
SJT.barra(LIG,document.querySelector("header"));
sugerirMotoristas();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
