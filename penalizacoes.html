<style>
/* Layout: formulário (volta, motorista, motivo) em cima, registos do dia por baixo, exportação no fim */
:root{
  --bg:#0c0f0d; --panel:#151a17; --line:#26302a; --fg:#eef3ef; --muted:#93a39a;
  --green:#B9D406; --green-dk:#94aa05; --green-ink:#0a0a0a; --danger:#e0574f;
  --display:"Roboto Condensed","sans-serif-condensed","Arial Narrow",Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{padding-block:calc(14px + env(safe-area-inset-top,0px)) 12px;border-bottom:2px solid var(--green);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:40px;width:auto;max-width:42%;background:#fff;border-radius:8px;padding:5px 8px;flex:none}
h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.voltar{display:inline-flex;align-items:center;min-height:36px;color:var(--green);font:600 15px var(--body);text-decoration:none;letter-spacing:.02em}
.datebox input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:500 14px var(--mono)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0;color:var(--green);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 span{font:600 15px var(--mono);color:var(--muted)}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.campo textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px;font:500 17px var(--body);min-height:84px;resize:vertical}
.campo textarea:focus{border-color:var(--green);outline:none}
.campo label i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400}
.r .obs{font-size:14px;color:var(--fg);border-left:2px solid var(--line);padding-left:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.campo input,.campo select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px;font:500 18px var(--body);min-height:50px}
.campo input:focus,.campo select:focus{border-color:var(--green);outline:none}
.campo input.mono{font-family:var(--mono);font-weight:600}
.campo.erro input,.campo.erro select{border-color:var(--danger)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--green) 50%),linear-gradient(135deg,var(--green) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px!important}
.aviso{font-size:14px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px}
.registar{border:0;border-radius:10px;padding:16px;font:700 21px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;background:var(--green);color:var(--green-ink)}
.registar:active{background:var(--green-dk)}
.registar:disabled{background:var(--line);color:var(--muted);cursor:default}
#lista{display:flex;flex-direction:column;gap:8px}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 14px}
.r .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.r .vol{font:700 22px/1 var(--display);letter-spacing:.03em;overflow-wrap:anywhere}
.r .vol small{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.r .h{font:600 14px var(--mono);color:var(--green)}
.r .mot{font-size:15px;overflow-wrap:anywhere}
.r .mtr{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.r .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.anular{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:10px 12px;font:600 13px var(--body);cursor:pointer}
.anular.confirm{border-color:var(--danger);color:var(--danger)}
.vazio{font-size:14px;color:var(--muted)}
.btn{border-radius:10px;padding:16px;font:700 20px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--green);border:2px solid var(--green)}
.msg{font-size:14px;min-height:20px}
.msg.ok{color:var(--green)} .msg.err{color:var(--danger)}
.hint{font-size:13px;color:var(--muted)}
</style>
</head>

      <label for="volta">Volta</label>

    <button class="btn" id="excel" type="button">Exportar Excel do dia</button>
    <div class="msg" id="msgX" role="status"></div>

<script>
/* MOTIVOS PROVISÓRIOS — substituir pela lista real. A ordem desta lista é a ordem do menu. */
const MOTIVOS=["Motivo 1","Motivo 2","Motivo 3","Motivo 4","Motivo 5"];
/* Sugestões de voltas (as mesmas de Chegadas e Saídas); pode-se escrever outra qualquer */
const VOLTAS=["1123","1633","1636","1419","1420","1639","1627","1638","1205","1235","1603","1201","1602","1204","1113","1112","1311","1330","1337","1340","1445","1315","1318","1624","1316","1334","1314","1317","1641"];

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const diaDe=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoje=()=>diaDe(new Date());
const hora=iso=>{const d=new Date(iso);return pad(d.getHours())+":"+pad(d.getMinutes());};

/* BD: { "AAAA-MM-DD": [ {id, t: hora ISO, volta, motorista, motivo} ] } */
let BD={},aConfirmar=null,diaAberto=hoje();
try{BD=JSON.parse(localStorage.getItem("penalizacoes")||"{}")||{};}catch(e){BD={};}
function gravar(){try{localStorage.setItem("penalizacoes",JSON.stringify(BD));return true}catch(e){return false}}
function msg(id,t,ok){const m=$(id);m.textContent=t||"";m.className="msg "+(ok?"ok":"err");}

MOTIVOS.forEach(m=>{const o=document.createElement("option");o.value=o.textContent=m;$("motivo").appendChild(o);});
VOLTAS.forEach(v=>{const o=document.createElement("option");o.value=v;$("voltas").appendChild(o);});
/* Sugere os motoristas já usados neste telemóvel */
function sugerirMotoristas(){
  const nomes=new Set();Object.values(BD).forEach(l=>l.forEach(r=>r.motorista&&nomes.add(r.motorista)));
  const dl=$("motoristas");dl.textContent="";[...nomes].sort((a,b)=>a.localeCompare(b,"pt")).forEach(n=>{const o=document.createElement("option");o.value=n;dl.appendChild(o);});
}

$("dia").value=diaAberto;
$("dia").addEventListener("change",()=>{aConfirmar=null;msg("msg","");msg("msgX","");render();});
["volta","motorista","motivo"].forEach(k=>$(k).addEventListener("input",()=>$("c-"+k).classList.remove("erro")));

function render(){
  const dia=$("dia").value||hoje(),eHoje=dia===hoje(),l=(BD[dia]||[]).slice().sort((a,b)=>b.t.localeCompare(a.t));
  $("aviso").hidden=eHoje;$("registar").disabled=!eHoje;
  ["volta","motorista","motivo","obs"].forEach(k=>$(k).disabled=!eHoje);
  $("total").textContent=l.length;
  const el=$("lista");el.textContent="";
  if(!l.length){const p=document.createElement("div");p.className="vazio";p.textContent="Sem penalizações registadas neste dia.";el.appendChild(p);return;}
  l.forEach(r=>{
    const row=document.createElement("div");row.className="r";
    const info=document.createElement("div");info.className="info";
    const top=document.createElement("div");top.className="top";
    const v=document.createElement("span");v.className="vol";v.innerHTML="<small>Volta</small>";v.append(r.volta);
    const h=document.createElement("span");h.className="h";h.textContent=hora(r.t);
    top.append(v,h);
    const m=document.createElement("div");m.className="mot";m.textContent=r.motivo;
    const mt=document.createElement("div");mt.className="mtr";mt.textContent=r.motorista;
    info.append(top,m,mt);
    if(r.obs){const o=document.createElement("div");o.className="obs";o.textContent=r.obs;info.appendChild(o);}
    const b=document.createElement("button");b.type="button";b.className="anular"+(aConfirmar===r.id?" confirm":"");
    b.textContent=aConfirmar===r.id?"Confirmar":"Apagar";b.hidden=!eHoje;b.onclick=()=>apagar(r.id);
    b.setAttribute("aria-label",(aConfirmar===r.id?"Confirmar apagar":"Apagar")+" penalização da volta "+r.volta);
    row.append(info,b);el.appendChild(row);
  });
}

$("registar").onclick=()=>{
  const volta=$("volta").value.trim(),motorista=$("motorista").value.trim().replace(/\s+/g," "),motivo=$("motivo").value,obs=$("obs").value.trim();
  const falta=[];
  if(!volta){falta.push("a volta");$("c-volta").classList.add("erro");}
  if(!motorista){falta.push("o motorista");$("c-motorista").classList.add("erro");}
  if(!motivo){falta.push("o motivo");$("c-motivo").classList.add("erro");}
  if(falta.length){msg("msg","Falta indicar "+falta.join(", ").replace(/, ([^,]*)$/," e $1")+".",false);return;}
  const agora=new Date(),dia=diaDe(agora);
  if($("dia").value!==dia)$("dia").value=dia;
  const r={id:agora.getTime().toString(36)+Math.random().toString(36).slice(2,6),t:agora.toISOString(),volta,motorista,motivo,obs};
  (BD[dia]=BD[dia]||[]).push(r);
  if(!gravar()){BD[dia].pop();if(!BD[dia].length)delete BD[dia];msg("msg","O telemóvel não deixou guardar (sem espaço ou armazenamento bloqueado).",false);return;}
  $("volta").value="";$("motorista").value="";$("motivo").value="";$("obs").value="";
  aConfirmar=null;msg("msg","Penalização registada: volta "+volta+", "+motorista+", "+motivo+".",true);
  sugerirMotoristas();render();$("volta").focus();
};

function apagar(id){
  if(aConfirmar!==id){aConfirmar=id;render();setTimeout(()=>{if(aConfirmar===id){aConfirmar=null;render();}},4000);return;}
  aConfirmar=null;const dia=$("dia").value;
  if(BD[dia]){BD[dia]=BD[dia].filter(r=>r.id!==id);if(!BD[dia].length)delete BD[dia];}
  gravar();sugerirMotoristas();msg("msg","Penalização apagada.",true);render();
}

/* Se a app ficar aberta e passar a meia-noite, muda para o novo dia */
function virarDia(){if($("dia").value===diaAberto&&hoje()!==diaAberto){diaAberto=hoje();$("dia").value=diaAberto;render();}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")virarDia();});
setInterval(virarDia,60000);

/* Gerador mínimo de .xlsx (sem bibliotecas, funciona offline) */
const MIME_XLSX="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const [name,data] of files){
    const nb=enc.encode(name),crc=crc32(data);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,data);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+data.length;
  }
  const cdSize=central.reduce((a,p)=>a+p.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  const all=[...parts,...central,end],out=new Uint8Array(all.reduce((a,p)=>a+p.length,0));let o=0;
  for(const p of all){out.set(p,o);o+=p.length;}return out;
}
function criarXlsx({titulo,folha,cab,linhas,larguras}){
  const X=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const L="ABCDEFGH",nc=cab.length,ult=3+linhas.length;
  const cel=(r,c,v,s)=>v===""||v==null?`<c r="${L[c]}${r}" s="${s}"/>`:typeof v==="number"?`<c r="${L[c]}${r}" s="${s}"><v>${v}</v></c>`:`<c r="${L[c]}${r}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${X(v)}</t></is></c>`;
  let rows=`<row r="1" ht="26" customHeight="1">`+cab.map((_,c)=>cel(1,c,c?"":titulo,1)).join("")+`</row><row r="2"/>`;
  rows+=`<row r="3" ht="24" customHeight="1">`+cab.map((v,c)=>cel(3,c,v,2)).join("")+`</row>`;
  linhas.forEach((l,i)=>{const r=4+i;rows+=`<row r="${r}">`+l.map((v,c)=>cel(r,c,v,i%2?4:3)).join("")+`</row>`;});
  const NS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"',H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const W=larguras.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("");
  const sheet=`${H}<worksheet ${NS}><sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="3" topLeftCell="A4" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${W}</cols><sheetData>${rows}</sheetData><autoFilter ref="A3:${L[nc-1]}${ult}"/><mergeCells count="1"><mergeCell ref="A1:${L[nc-1]}1"/></mergeCells></worksheet>`;
  const fill=c=>`<fill><patternFill patternType="solid"><fgColor rgb="FF${c}"/><bgColor indexed="64"/></patternFill></fill>`;
  const bd=`<border><left style="thin"><color rgb="FF000000"/></left><right style="thin"><color rgb="FF000000"/></right><top style="thin"><color rgb="FF000000"/></top><bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/></border>`;
  const xf=(f,fi,b,h)=>`<xf numFmtId="0" fontId="${f}" fillId="${fi}" borderId="${b}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="${h}" vertical="center"/></xf>`;
  const styles=`${H}<styleSheet ${NS}><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><color rgb="FFB9D406"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFB9D406"/><name val="Calibri"/></font></fonts><fills count="5"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fill("000000")}${fill("FFFFFF")}${fill("EEF5B8")}</fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${bd}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${xf(1,2,0,"left")}${xf(2,2,1,"center")}${xf(0,3,1,"center")}${xf(0,4,1,"center")}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const wb=`${H}<workbook ${NS} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${X(folha)}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${X(folha)}'!$A$3:$${L[nc-1]}$${ult}</definedName></definedNames></workbook>`;
  const R="http://schemas.openxmlformats.org/officeDocument/2006/relationships",P="http://schemas.openxmlformats.org/package/2006/relationships";
  const ct=`${H}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const rels=`${H}<Relationships xmlns="${P}"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const wrels=`${H}<Relationships xmlns="${P}"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/styles" Target="styles.xml"/></Relationships>`;
  const e=new TextEncoder();
  return zipStore([["[Content_Types].xml",e.encode(ct)],["_rels/.rels",e.encode(rels)],["xl/workbook.xml",e.encode(wb)],["xl/_rels/workbook.xml.rels",e.encode(wrels)],["xl/styles.xml",e.encode(styles)],["xl/worksheets/sheet1.xml",e.encode(sheet)]]);
}
function gerarExcel(dia){
  const l=(BD[dia]||[]).slice().sort((a,b)=>a.t.localeCompare(b.t));
  if(!l.length)return null;
  const [y,m,d]=dia.split("-");
  const linhas=l.map(r=>[d+"/"+m+"/"+y,/^\d+$/.test(r.volta)?+r.volta:r.volta,r.motorista,r.motivo,(r.obs||"").replace(/\s*\n\s*/g," ")]);
  return {bytes:criarXlsx({titulo:"PENALIZAÇÕES — "+d+"/"+m+"/"+y,folha:"Penalizações",cab:["Data","Volta","Motorista","Motivo","Observações"],linhas,larguras:[13,12,28,30,48]}),nome:`penalizacoes-${y}-${m}-${d}.xlsx`};
}
$("excel").onclick=()=>{
  try{
    const x=gerarExcel($("dia").value||hoje());
    if(!x){msg("msgX","Ainda não há penalizações registadas neste dia.",false);return;}
    const url=URL.createObjectURL(new Blob([x.bytes],{type:MIME_XLSX}));
    const a=document.createElement("a");a.href=url;a.download=x.nome;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
    msg("msgX","Excel gerado: "+x.nome+" (ver em Transferências).",true);
  }catch(err){msg("msgX","Não foi possível gerar o Excel.",false);}
};
